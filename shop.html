<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKT</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <div id="root">
        <div class="app-shell">
            <header class="site-header"><button class="brand" aria-label="На головну">MKT<span>.</span>COURSES</button>
                <nav aria-label="Основна навігація"><button class="">Курси</button><button class="cart-link"><svg
                            viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M6.5 8.5h11l1 12h-13l1-12Z"></path>
                            <path d="M9 9V6.5a3 3 0 0 1 6 0V9"></path>
                        </svg>Кошик<span class="cart-count">0</span></button></nav>
            </header>
            <main class="cart-page"><button class="back-button"><span>←</span> Продовжити вибір</button>
                <div class="cart-title">
                    <p class="eyebrow">Твій вибір</p>
                    <h1>Кошик <span>(0)</span></h1>
                </div>
                <div class="empty-cart"><svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6.5 8.5h11l1 12h-13l1-12Z"></path>
                        <path d="M9 9V6.5a3 3 0 0 1 6 0V9"></path>
                    </svg>
                    <h2>Тут поки порожньо</h2>
                    <p>Обери курс, який допоможе зробити наступний крок у кар’єрі.</p><button
                        class="primary-button">Переглянути курси <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 12h14M13 6l6 6-6 6"></path>
                        </svg></button>
                </div>
            </main>
            <footer>
                <div class="brand">MKT<span>.</span>COURSES</div>
                <p>Навчаємо маркетингу людською мовою.</p><span>© 2025 MKT.Courses</span>
            </footer>
        </div>
    </div>
</body>

</html>
